<html>
<head>
    <title>Paragraph Assignment</title>
</head>
<body>

    <button onclick="toggleText()">Hide/Show Paragraph</button>
    <br><br>

    <p id="myPara" onmouseover="makeBlue()" onmouseout="makeBlack()">
    This is Lionel Messi Hover over this text to see the color change!
    </p>

    <script>
        // Simple standard functions instead of arrow functions
        function toggleText() {
            var x = document.getElementById("myPara");
            
            if (x.style.display === "none") {
                x.style.display = "block";
            } else {
                x.style.display = "none";
            }
        }

        function makeBlue() {
            var x = document.getElementById("myPara");
            x.style.color = "blue";
        }

        function makeBlack() {
            var x = document.getElementById("myPara");
            x.style.color = "black";
        }
    </script>

</body>
</html>

<body>
    <script>
        
        // switch ........
        let grade='C';

        switch (grade) {
            case 'A' :result="First Division";
            break;
            case 'B' :result="Second Division";
            break;
            case 'C' :result="Third Division";
            break;
            default:result="Fail";
            break;
        }
        console.log(result);
    </script>

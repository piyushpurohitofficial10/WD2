        //default PARAMETER
        function add(a,b){
            console.log("Add "+ (a+b));
        }
        add(123);
        //synchronous function
        function cal(){
            function add(a,b){
                console.log("Add "+ (a+b));
            }
        function sub(a,b){
            console.log("Sub "+ (a-b));
        }
        function mul(a,b){
            console.log("Mul "+ (a*b));
        }

        sub(15,6);

    cal();

    }
    msg2(10,20);
    // IIFE:-

    //Promise:-used to handle asynchronous operations
    let myPromise=new Promise(function(resolve,reject){
        let a=10;
        let b=20;
        if(a+b==30){
            resolve("Success");
        }
        else{
            reject("Failed");
        }
    });
    myPromise
        .then(msg=>console.log(msg))
        .catch(err=>console.log(err));
        console.log(myPromise);

        // What is Synchronous and Asynchronous in JavaScript?
        // Synchronous: In synchronous programming, tasks are executed one after another, and each task
        // must complete before the next one starts. This can lead to blocking behavior, where the program waits for a task to finish before 
        // moving on to the next one.
        // Asynchronous: In asynchronous programming, tasks can be initiated and then continue to run in
        // the background while the program continues to execute other tasks. This allows for non-blocking behavior, 
        // where the program can handle multiple tasks concurrently without waiting for each one to finish before starting the next.
